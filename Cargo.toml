[workspace]
members = [
    "crates/mncs-model",
    "crates/mncs-compiler",
    "crates/mncs-cli",
    "crates/mncs-syntax",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/epi13/mncs-language"
rust-version = "1.79"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
