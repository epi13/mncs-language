[workspace]
members = [
    "crates/mncs-model",
    "crates/mncs-compiler",
    "crates/mncs-codegen",
    "crates/mncs-translation-check",
    "crates/mncs-cli",
    "crates/mncs-syntax",
    "crates/mncs-conformance",
    "crates/mncs-embed",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/epi13/mncs-language"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = "2"
# Unix-only `O_NOFOLLOW` for the filesystem provider's final-component
# symlink gate (Tranche B). Already in the lockfile transitively.
libc = "0.2"

[profile.fabric]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
