name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.79.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Validate accepted example
        run: cargo run -p mncs-cli -- validate examples/account-transfer.mncs.json
      - name: Reject undeclared effect example
        shell: bash
        run: |
          if cargo run -p mncs-cli -- validate examples/invalid-undeclared-effect.mncs.json; then
            echo "invalid example was unexpectedly accepted" >&2
            exit 1
          fi
      - name: Run source syntax tournament
        run: >-
          cargo run -p mncs-cli -- syntax-tournament
          examples/syntax/account-transfer.tournament.json
      - name: Exercise semantic foundation commands
        shell: bash
        run: |
          cargo run -p mncs-cli -- canonicalize examples/semantic-foundation/before.mncs.json
          cargo run -p mncs-cli -- graph examples/semantic-foundation/before.mncs.json
          cargo run -p mncs-cli -- diff examples/semantic-foundation/before.mncs.json examples/semantic-foundation/after.mncs.json
          cargo run -p mncs-cli -- compare examples/semantic-foundation/before.mncs.json examples/semantic-foundation/after.mncs.json
          cargo run -p mncs-cli -- ir examples/account-transfer.mncs.json
          cargo run -p mncs-cli -- obligations examples/account-transfer.mncs.json
          cargo run -p mncs-cli -- verify examples/account-transfer.mncs.json
          cargo run -p mncs-cli -- obligations examples/ir/unknown-contract-evidence.mncs.json
          if cargo run -p mncs-cli -- verify examples/ir/unknown-contract-evidence.mncs.json; then
            echo "UNKNOWN obligation was unexpectedly accepted as verified" >&2
            exit 1
          fi
          if cargo run -p mncs-cli -- diagnose examples/invalid-undeclared-effect.mncs.json; then
            echo "invalid diagnostic example was unexpectedly accepted" >&2
            exit 1
          fi
          cargo run -p mncs-cli -- evidence-manifest examples/semantic-foundation/before.mncs.json > /tmp/mncs-evidence.json
          cargo run -p mncs-cli -- evidence-check /tmp/mncs-evidence.json examples/semantic-foundation/after.mncs.json
      - name: Exercise executable semantic body workflows
        shell: bash
        run: |
          cargo run -p mncs-cli -- validate examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- validate examples/executable/effectful-record.mncs.json
          cargo run -p mncs-cli -- validate examples/executable/runtime-check.mncs.json
          if cargo run -p mncs-cli -- validate examples/executable/invalid-body-capability.mncs.json; then
            echo "invalid executable body was unexpectedly accepted" >&2
            exit 1
          fi
          cargo run -p mncs-cli -- body examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- ir examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- ssa examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- compile examples/compiler-study/bounded-sum.mncs.json --emit semantic,hir,ssa,evidence
          cargo run -p mncs-cli -- compiler-study examples/compiler-study/bounded-sum.mncs.json --node-id ci-linux-x86_64
          cargo run -p mncs-cli -- trace examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- obligations examples/executable/checked-add.mncs.json
          cargo run -p mncs-cli -- verifier-request examples/executable/checked-add.mncs.json > /tmp/mncs-verifier-requests.json
          if cargo run -p mncs-cli -- verify examples/executable/checked-add.mncs.json > /tmp/mncs-verifier-results.json; then
            echo "unresolved executable obligation was unexpectedly verified" >&2
            exit 1
          fi
          jq '.[0]' /tmp/mncs-verifier-requests.json > /tmp/mncs-verifier-request.json
          jq '.[0]' /tmp/mncs-verifier-results.json > /tmp/mncs-verifier-result.json
          if cargo run -p mncs-cli -- verify-result examples/executable/checked-add.mncs.json /tmp/mncs-verifier-request.json /tmp/mncs-verifier-result.json; then
            echo "UNKNOWN imported verifier result was unexpectedly accepted" >&2
            exit 1
          fi
          cargo run -p mncs-cli -- execute examples/executable/checked-add.mncs.json examples/execution/checked-add-request.json
          cargo run -p mncs-cli -- execute-ssa examples/executable/checked-add.mncs.json examples/execution/checked-add-request.json
          if cargo run -p mncs-cli -- execute examples/executable/runtime-check.mncs.json examples/execution/runtime-check-request.json; then
            echo "body runtime check was unexpectedly executable" >&2
            exit 1
          fi
          if cargo run -p mncs-cli -- execute-ssa examples/executable/runtime-check.mncs.json examples/execution/runtime-check-request.json; then
            echo "SSA runtime check was unexpectedly executable" >&2
            exit 1
          fi
          cargo run -p mncs-cli -- compare-execution examples/execution/bounded-sum-baseline.mncs.json examples/execution/bounded-sum-equivalent-refactor.mncs.json examples/execution/bounded-sum-corpus.json
          if cargo run -p mncs-cli -- compare-execution examples/execution/bounded-sum-baseline.mncs.json examples/execution/bounded-sum-regression.mncs.json examples/execution/bounded-sum-corpus.json; then
            echo "intentional execution regression was unexpectedly accepted" >&2
            exit 1
          fi
          if cargo run -p mncs-cli -- evaluate-candidate examples/semantic-foundation/before.mncs.json examples/refinement/contract-repair.proposal.json; then
            echo "candidate with regressed protected property was unexpectedly accepted" >&2
            exit 1
          fi
          for fixture in bounded-sum-baseline bounded-sum-equivalent-refactor bounded-sum-regression; do
            cargo run -p mncs-cli -- check-lowering-execution "examples/execution/${fixture}.mncs.json" examples/execution/bounded-sum-corpus.json
          done
          for fixture in bounded-range-baseline bounded-range-equivalent-refactor bounded-range-regression; do
            cargo run -p mncs-cli -- validate "examples/execution/${fixture}.mncs.json"
            cargo run -p mncs-cli -- check-lowering-execution "examples/execution/${fixture}.mncs.json" examples/execution/bounded-range-corpus.json
          done
          cargo run -p mncs-cli -- compare-execution examples/execution/bounded-range-baseline.mncs.json examples/execution/bounded-range-equivalent-refactor.mncs.json examples/execution/bounded-range-corpus.json
          if cargo run -p mncs-cli -- compare-execution examples/execution/bounded-range-baseline.mncs.json examples/execution/bounded-range-regression.mncs.json examples/execution/bounded-range-corpus.json; then
            echo "bounded-range regression was unexpectedly accepted" >&2
            exit 1
          fi
      - name: Exercise Forge Provider Protocol adapter
        shell: bash
        run: |
          printf '%s\n' '{"protocol_version":"0.1","type":"capabilities","request_id":"ci-capabilities"}' \
            | python3 tools/mncs_language_forge_provider.py | jq -e '.type == "capabilities" and (.analyses | index("mncs-language-ssa-integrity")) != null'
          printf '%s\n' '{"protocol_version":"0.1","type":"analysis_request","request_id":"ci-ssa","analysis":"mncs-language-ssa-integrity","component":{"candidate_identity":"ci","changed_paths":[]}}' \
            | python3 tools/mncs_language_forge_provider.py | jq -e '.type == "analysis_response" and .status == "PASS" and .witnesses[0].schema_version == "0.4"'
          printf '%s\n' '{"protocol_version":"0.1","type":"analysis_request","request_id":"ci-execution","analysis":"mncs-language-execution-equivalence","component":{"candidate_identity":"ci","changed_paths":[]}}' \
            | python3 tools/mncs_language_forge_provider.py | jq -e '.type == "analysis_response" and .status == "PASS" and .witnesses[0].matching_cases == .witnesses[0].corpus_size and .witnesses[1].mismatching_cases > 0'
          printf '%s\n' '{"protocol_version":"0.1","type":"analysis_request","request_id":"ci-lowering-execution","analysis":"mncs-language-lowering-execution-consistency","component":{"candidate_identity":"ci","changed_paths":[]}}' \
            | python3 tools/mncs_language_forge_provider.py | jq -e '.type == "analysis_response" and .status == "PASS" and (.witnesses | length) == 8 and (.witnesses | all(.[]; (.matching_cases == .corpus_size) or (.mismatching_cases > 0)))'
