version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mncs"
path = "src/main.rs"

[dependencies]
mncs-compiler = { path = "../mncs-compiler" }
mncs-codegen = { path = "../mncs-codegen" }
mncs-translation-check = { path = "../mncs-translation-check" }
mncs-model = { path = "../mncs-model" }
mncs-syntax = { path = "../mncs-syntax" }
mncs-conformance = { path = "../mncs-conformance" }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
sha2.workspace = true
